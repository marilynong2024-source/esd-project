# Reverse-proxy APIs so the UI uses same-origin requests (http://localhost:8080/api/...)
# and avoids browser issues with direct :5101 / :5105 / :5106.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s;

    # Variable proxy_pass does not strip the location prefix; rewrite so backends see /path not /api/.../path.
    # `set` must come before `rewrite ... break` (break skips later rewrite-phase directives including set).
    location /api/account/ {
        set $account_upstream http://account:5100;
        rewrite ^/api/account/(.*)$ /account/$1 break;
        proxy_pass $account_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/booking/ {
        set $booking_upstream http://booking:5101;
        rewrite ^/api/booking/(.*)$ /$1 break;
        proxy_pass $booking_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/loyalty/ {
        set $loyalty_upstream http://loyalty:5105;
        rewrite ^/api/loyalty/(.*)$ /$1 break;
        proxy_pass $loyalty_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/notification/ {
        set $notification_upstream http://notification:5106;
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $notification_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Exact match so /api/flight/search always hits Flask /flight/search (never /search, which 404s).
    location = /api/flight/search {
        proxy_pass http://flight:5102/flight/search$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Second rewrite maps /api/flight/flight/... → /flight/..., /api/flight/release-seat → /release-seat, etc.
    location /api/flight/ {
        set $flight_upstream http://flight:5102;
        rewrite ^/api/flight/search$ /flight/search break;
        rewrite ^/api/flight/(.*)$ /$1 break;
        proxy_pass $flight_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/hotel/ {
        set $hotel_upstream http://hotel:5103;
        rewrite ^/api/hotel/(.*)$ /$1 break;
        proxy_pass $hotel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/payment/ {
        set $payment_upstream http://payment:5104;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass $payment_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Health check hits gateway root (works even if /health route is missing on older images)
    location = /api/graphql/health {
        proxy_pass http://graphql:5110/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/graphql/ {
        set $graphql_upstream http://graphql:5110;
        rewrite ^/api/graphql/(.*)$ /$1 break;
        proxy_pass $graphql_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/discount/ {
        set $discount_upstream http://discount:5112;
        rewrite ^/api/discount/(.*)$ /$1 break;
        proxy_pass $discount_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Diagram endpoint: GET /bundle-price (exact path so query strings always proxy correctly)
    # Exposed as: GET http://localhost:8080/api/bundle-price?origin=...&destination=...
    location = /api/bundle-price {
        proxy_pass http://bundle-pricing:5111/bundle-price;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
